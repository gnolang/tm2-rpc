name: E2E Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    # pnpm version comes from the packageManager field in package.json
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install
    - name: Build the project
      run: pnpm build
    - name: Run tests
      run: |
          docker compose up -d
          pnpm test
          ./node_modules/.bin/wait-on  http://127.0.0.1:26657/status --timeout 30000 && sleep 20s && node dist/example.cjs
          docker compose logs